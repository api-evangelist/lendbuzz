aid: lendbuzz
name: Lendbuzz
description: 'Lendbuzz is a Boston-headquartered auto finance platform, founded in
  2015, that uses machine learning and alternative data — bank transaction history,
  education, employment and income signals rather than a traditional FICO file — to
  underwrite consumers with thin or no US credit history. The company originates retail
  auto loans through a nationwide network of franchise and independent dealerships,
  and also provides dealers with floor planning and an AI-assisted "Express Contract"
  digital contracting flow. Dealers submit and manage deals through the Lendbuzz Dealer
  Portal at app.lendbuzz.com, or by routing credit applications through the Dealertrack
  and RouteOne F&I networks; consumers use a separate Client Portal. Lendbuzz Funding,
  LLC is a licensed lender (NMLS ID #1636296) and funds originations through recurring
  asset-backed securitizations. As of this profiling pass Lendbuzz publishes no public
  developer portal, API documentation, or machine-readable API contract — partner integration
  is intermediated by Dealertrack and RouteOne.'
